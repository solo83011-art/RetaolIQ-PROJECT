<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification</title>
</head>
<body>
    <form action="" method="post" enctype="multipart/form-data">
        <table>
            <tr>
                <td><label>Notification ID:</label></td>
                <td></td>
            </tr>
            <tr>
                <td><label>Title:</label></td>
                <td><input type="text" name="title" placeholder="Enter title"></td>
            </tr>
            <tr>
                <td><label>Message:</label></td>
                <td><textarea name="message" rows="4" placeholder="Enter message"></textarea></td>
            </tr>
            <tr>
                <td><label>Add Image:</label></td>
                <td><input type="file" name="notificationImage" accept="image/*"></td>
            </tr>
            <tr>
                <td>
                    <button type="submit">Submit Notification</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
