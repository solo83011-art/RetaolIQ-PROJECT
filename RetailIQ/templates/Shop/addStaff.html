<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <table>
            <tr>
            <td><label>Name</label></td>
            <td><input type="text" name="shopName" placeholder="enter staff name"></td>
            </tr>
            <tr>
            <td><label>Email</label></td>
            <td><input type="email" name="email" placeholder="enter email"></td>
            </tr>
            <tr>
            <td><label>Phone</label></td>
            <td><input type="tel" name="shopPhone" placeholder="enter mobile number"></td>
            </tr>
            <tr>
            <td><label>Designation</label></td>
            <td><input type="text" name="designation" placeholder="enter designation"></td>
            </tr>
            <tr>
            <td><label>Assigned Counter</label></td>
            <td><input type="number" name="assigned counter"></td>
            </tr>
            <tr>
            <td><label>Assigned Staff Category</label></td>
            <td><input type="text" name="assignedstaffcategory"></td>
            </tr>
            <tr>
            <td><label>Assigned Password</label></td>
            <td><input type="password" name="assigned password" placeholder="enter password"></td>
            </tr>
            <tr>
            <td colspan="2">
                <button type="submit">Add Staff</button>
            </td>
            </tr>
        </table>
    </form>
</body>
</html>
