<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <table>
            <tr>
                <td><label for="productName">Product Name</label></td>
                <td><input type="text" name="productName" placeholder="enter product name"></td>
            </tr>
            <tr>
                <td><label for="brand">Brand</label></td>
                <td><input type="text" name="brand" placeholder="enter brand"></td>
            </tr>
            <tr>
                <td><label for="Quantity">Quantity</label></td>
                <td><input type="number" name="Quantity" placeholder="enter Quantity"></td>
            </tr>
            <tr>
                <td><label for="Purchaseprice">Purchase Price</label></td>
                <td><input type="number" name="Purchaseprice"></td>
            </tr>
            <tr>
                <td><label for="sellingprice">Selling Price</label></td>
                <td><input type="number" name="sellingprice"></td>
            </tr>
            <tr>
                <td><label for="assignedstaffcategory">Category</label></td>
                <td><input type="text" name="assignedstaffcategory"></td>
            </tr>
            <tr>
                <td><label for="manufacturingdate">Manufacturing Date</label></td>
                <td><input type="date"  name="manufacturingdate"></td>
            </tr>
            <tr>
                <td><label for="Expirydate">Expiry Date</label></td>
                <td><input type="date"  name="Expirydate"></td>
            </tr>
            <tr>
                <td><label for="barcode">Barcode</label></td>
                <td><input type="number"  name="barcode"></td>
            </tr>
            <tr>
                <td><label for="suppliername">Supplier Name</label></td>
                <td><input type="text"  name="suppliername"></td>
            </tr>
            <tr>
                <td><label for="supplieremail">Supplier Email</label></td>
                <td><input type="email"  name="supplieremail"></td>
            </tr>
            <tr>
                <td><label for="supplierphone">Supplier Phone</label></td>
                <td><input type="tel"  name="supplierphone"></td>
            </tr>
            <tr>
                <td><label for="description">Description</label></td>
                <td><textarea  name="description" rows="3"></textarea></td>
            </tr>
        </table>
    </form>
</body>
</html>
